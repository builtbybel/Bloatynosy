; App classification rules. Keep this editable list separate from the built-in protection.
; Safe means candidate, not automatic removal. Protected always wins.
; Matching: package-family prefix, or *suffix. Unknown packages are Personal.

[Apps Windows needs]
Action=apps
Safety=Protected
Package=*_cw5n1h2txyewy
Package=Microsoft.WindowsStore
Package=Microsoft.DesktopAppInstaller
Package=Microsoft.SecHealthUI
Package=Microsoft.UI.Xaml
Package=Microsoft.VCLibs
Package=Microsoft.NET.Native
Package=Microsoft.WindowsAppRuntime
Package=Microsoft.MicrosoftEdge

; cw5n1h2txyewy is the publisher id Windows signs its own shell with. Settings, the Start
; menu, search, the lock screen and the widget host all carry it, and none of them are apps
; you uninstall - the ones worth turning off have a section of their own above.
; the rest ship under the ordinary Microsoft publisher, so they need naming one by one

