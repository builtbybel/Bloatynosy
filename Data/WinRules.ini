; WinRules.ini, the change catalogue of Bloatynosy. One section is one setting.
; Any other .ini you drop in this folder is read too, AppRules.ini excepted. A section name that
; already exists replaces the one before it, so a file of your own can correct an entry of mine.
;
; The section heading is the name shown in the list and has to be unique.
; A line starting with ; is a comment, and a comment may follow a value when a space comes first.
;
;   Category          = Ads | AI | Appearance | Edge | Gaming | Privacy | System | Taskbar | Updates
;   Description       = the plain words shown when the row is selected
;   Restart           = explorer | system, when the change is only visible afterwards (else omit)
;   OsVersion         = 10 | 11 (omit = both)
;   RequiresKey       = a registry key that has to exist, or the setting is not listed at all.
;                       Meant for rules about other programs: name a key of that program and the
;                       row stays away on a pc that has not got it. Several keys may be written
;                       with a | between them, and one of them being there is enough.
;   Group             = a name shared by sections that are variants of one setting, for the cases
;                       where Windows keeps a choice in a single value instead of a switch. Only
;                       one row of a group can be ticked, so two of them can no longer be applied
;                       one over the other. Use it only for real alternatives: a group whose rows
;                       write different values would just be switches that block each other.
;   DefaultSelected   = true ticks the setting after a check, unless a profile decides
;
;   Path              = hive and key in one line, long or short:
;                       HKCU\... HKLM\... HKCR\... HKU\... HKCC\... or HKEY_CURRENT_USER\... etc.
;   ValueName         = the value to write, (Default) for the key's unnamed value
;   ValueType         = DWORD | QWORD | String | ExpandString | Binary (omit = DWORD)
;                       numbers may be written 0x1 as well, Binary as hex pairs
;   RecommendedValue  = what applying writes, and what the check compares against
;   DefaultValue      = what resetting writes. Without it the setting cannot be put back.
;                       <deletevalue> removes just this value, <delete> the whole key
;   Path2..N / ValueName2..N / ValueType2..N / RecommendedValue2..N / DefaultValue2..N
;                     = further values of the same setting. The numbering stops at the first
;                       missing ValueName, and all of them are applied or none.
;                       Path2..N and ValueType2..N may be left out, and then the first Path
;                       and ValueType count, which is how a key with many values stays readable.
;
; Admin rights are needed for HKLM, HKCR and anything under \Policies\. The app detects that
; itself and says so, so there is no key for it.

