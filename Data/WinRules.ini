; --- Updates ------------------------------------------------------------------
; These are the static parts of the old "Windows Update Tamer" script.
; Pausing updates is not in here on purpose: it writes computed date
; stamps, which a fixed rule cannot express. That stays a setup action.
; The AU policies below are meant for Pro/Enterprise and may be ignored
; on Windows 11 Home.

[Keep Update Pause Available]
Category=Updates
Description=Raises the pause limit so Settings offers the long "pause updates" periods instead of only one week.
Path=HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\WindowsUpdate\UX\Settings
ValueName=FlightSettingsMaxPauseDays
ValueType=DWORD
RecommendedValue=36500
DefaultValue=<deletevalue>
DefaultSelected=true          ; recommended
Path2=HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate
ValueName2=SetDisablePauseUXAccess
ValueType2=DWORD
RecommendedValue2=0
DefaultValue2=<deletevalue>

[Never Restart While Signed In]
Category=Updates
Description=Stops Windows from rebooting on its own to finish an update while someone is still signed in.
Path=HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate\AU
ValueName=NoAutoRebootWithLoggedOnUsers
ValueType=DWORD
RecommendedValue=1
DefaultValue=<deletevalue>
DefaultSelected=true          ; recommended

[Download Updates But Ask Before Installing]
Category=Updates
Description=Keeps downloading updates but waits for your click to install them, instead of installing on its own schedule.
Path=HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate\AU
ValueName=AUOptions
ValueType=DWORD
RecommendedValue=3
DefaultValue=<deletevalue>

; deliberately not offered as a rule: NoAutoUpdate=1 switches updates off
; entirely and would silently outrank AUOptions above. Leaving a machine
; unpatched is not something a checkbox should do in passing.

[Do Not Include Drivers in Updates]
Category=Updates
Description=Leaves driver updates out of Windows Update, so a working driver is not replaced behind your back.
Path=HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate
ValueName=ExcludeWUDriversInQualityUpdate
ValueType=DWORD
RecommendedValue=1
DefaultValue=<deletevalue>

[Do Not Restart Devices Automatically]
Category=Updates
Description=Blocks the automatic restart that Windows schedules after an update outside active hours.
Path=HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate\AU
ValueName=AlwaysAutoRebootAtScheduledTime
ValueType=DWORD
RecommendedValue=0
DefaultValue=<deletevalue>

[Do Not Install Updates Early]
Category=Updates
Description=Turns off "get the latest updates as soon as they are available", so this pc waits for the regular rollout instead of taking the first wave.
Path=HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\WindowsUpdate\UX\Settings
ValueName=IsContinuousInnovationOptedIn
ValueType=DWORD
RecommendedValue=0
DefaultValue=<deletevalue>
DefaultSelected=true          ; recommended

[Download Updates Only From Microsoft]
Category=Updates
Description=Switches Delivery Optimization to Microsoft servers only, so this pc neither pulls update parts from nor serves them to other machines.
Path=HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Windows\DeliveryOptimization
ValueName=DODownloadMode
ValueType=DWORD
RecommendedValue=0
DefaultValue=<deletevalue>

[Do Not Download Device Icons and Info]
Category=Updates
Description=Stops Windows from fetching icons, names and app suggestions for newly connected hardware. Devices still work, they just show a generic icon.
Path=HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows\CurrentVersion\Device Metadata
ValueName=PreventDeviceMetadataFromNetwork
ValueType=DWORD
RecommendedValue=1
DefaultValue=0
