; Privacy.ini, a tweak pack of Bloatynosy. The format is the one WinRules.ini documents.
; This file is not part of the app: the store downloads it into the data folder, and the
; catalogue reads it from there like any other ini. Deleting it removes the pack again.

[Block the Advertising ID for Everyone]
Category=Privacy
Description=The switch in the settings turns the advertising id off for the account that clicks it. This is the policy behind it, so it stays off for every account on the pc and the switch goes grey.
Path=HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Windows\AdvertisingInfo
ValueName=DisabledByGroupPolicy
ValueType=DWORD
RecommendedValue=1
DefaultValue=<deletevalue>
DefaultSelected=true          ; recommended

[Disable Cloud Clipboard Sync]
Category=Privacy
Description=Keeps what you copy on this pc. Clipboard history still works locally, it just no longer travels through a Microsoft account to your other devices.
Path=HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Windows\System
ValueName=AllowCrossDeviceClipboard
ValueType=DWORD
RecommendedValue=0
DefaultValue=<deletevalue>

[Disable Inking and Typing Personalization]
Category=Privacy
Description=Stops the local dictionary Windows builds from what you type and write, and stops it reading names out of your contacts to feed it. Autocorrect keeps working, it just stops learning you.
Path=HKEY_CURRENT_USER\Software\Microsoft\InputPersonalization
ValueName=RestrictImplicitInkCollection
ValueType=DWORD
RecommendedValue=1
DefaultValue=0
DefaultSelected=true          ; recommended
ValueName2=RestrictImplicitTextCollection
RecommendedValue2=1
DefaultValue2=0
Path3=HKEY_CURRENT_USER\Software\Microsoft\InputPersonalization\TrainedDataStore
ValueName3=HarvestContacts
ValueType3=DWORD
RecommendedValue3=0
DefaultValue3=1

[Disable Handwriting Data Sharing]
Category=Privacy
Description=Prevents the handwriting error reports from being sent to Microsoft. Only does anything on a pc with a pen, where it is otherwise on.
Path=HKEY_CURRENT_USER\Software\Microsoft\Windows\CurrentVersion\Policies\TabletPC
ValueName=PreventHandwritingDataSharing
ValueType=DWORD
RecommendedValue=1
DefaultValue=<deletevalue>
Path2=HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Windows\TabletPC
ValueName2=PreventHandwritingDataSharing
ValueType2=DWORD
RecommendedValue2=1
DefaultValue2=<deletevalue>

[Disable Feedback Requests]
Category=Privacy
Description=Stops the how-likely-are-you-to-recommend dialog from ever appearing again. The Feedback Hub itself stays, you just have to go there yourself.
Path=HKEY_CURRENT_USER\Software\Microsoft\Siuf\Rules
ValueName=NumberOfSIUFInPeriod
ValueType=DWORD
RecommendedValue=0
DefaultValue=<deletevalue>
DefaultSelected=true          ; recommended
Path2=HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Windows\DataCollection
ValueName2=DoNotShowFeedbackNotifications
ValueType2=DWORD
RecommendedValue2=1
DefaultValue2=<deletevalue>

[Disable Windows Error Reporting]
Category=Privacy
Description=Stops crash dumps of your programs from going to Microsoft. You also stop getting the driver and update hints that come back from them, so keep this one if you debug a sick pc.
Path=HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows\Windows Error Reporting
ValueName=Disabled
ValueType=DWORD
RecommendedValue=1
DefaultValue=0
Path2=HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Windows\Windows Error Reporting
ValueName2=Disabled
ValueType2=DWORD
RecommendedValue2=1
DefaultValue2=<deletevalue>
