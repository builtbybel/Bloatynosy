; Gaming.ini, a tweak pack of Bloatynosy. The format is the one WinRules.ini documents.
; This file is not part of the app: the store downloads it into the data folder, and the
; catalogue reads it from there like any other ini. Deleting it removes the pack again.

[Enable Hardware Accelerated GPU Scheduling]
Category=Gaming
Description=Lets the graphics card schedule its own work instead of the kernel doing it, which lowers input latency in games. Needs a card and driver that support it, otherwise the value is simply ignored.
OsVersion=11
Restart=system
Path=HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Control\GraphicsDrivers
ValueName=HwSchMode
ValueType=DWORD
RecommendedValue=2
DefaultValue=<deletevalue>    ; windows ships no value here, 1 would leave one behind

[Prioritize Games in the Scheduler]
Category=Gaming
Description=Raises the slice of cpu, disk and gpu time Windows reserves for a process it recognizes as a game. The entry exists on every install, this only widens it.
Restart=system
Path=HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Multimedia\SystemProfile\Tasks\Games
ValueName=Priority
ValueType=DWORD
RecommendedValue=6
DefaultValue=2
ValueName2=Scheduling Category
ValueType2=String
RecommendedValue2=High
DefaultValue2=Medium
ValueName3=SFIO Priority
ValueType3=String
RecommendedValue3=High
DefaultValue3=Normal

[Honour Fullscreen Exclusive Mode]
Category=Gaming
Description=Stops Windows from quietly turning a game's real fullscreen into a borderless window. Alt-Tab gets slower again, the frame pacing gets better.
Path=HKEY_CURRENT_USER\System\GameConfigStore
ValueName=GameDVR_HonorUserFSEBehaviorMode
ValueType=DWORD
RecommendedValue=1
DefaultValue=0
ValueName2=GameDVR_DXGIHonorFSEWindowsCompatible
RecommendedValue2=1
DefaultValue2=0

[Enable Game Mode]
Category=Gaming
Description=Turns Game Mode on, which holds background work and driver installs back while a game runs. Off by default on a fresh install of some builds.
Path=HKEY_CURRENT_USER\Software\Microsoft\GameBar
ValueName=AutoGameModeEnabled
ValueType=DWORD
RecommendedValue=1
DefaultValue=0
DefaultSelected=true          ; recommended

[Disable Dynamic Lighting]
Category=Gaming
Description=Hands the rgb lighting of keyboard, mouse and case back to the maker's own software. Windows otherwise takes the devices over and the two fight about the colour.
OsVersion=11
Path=HKEY_CURRENT_USER\Software\Microsoft\Lighting
ValueName=AmbientLightingEnabled
ValueType=DWORD
RecommendedValue=0
DefaultValue=1
ValueName2=ControlledByForegroundApp
RecommendedValue2=0
DefaultValue2=1
